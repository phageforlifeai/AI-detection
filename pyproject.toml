[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scigram"
version = "1.0.0"
description = "Pangram-style Mixture-of-Experts AI content detector & scientific writing structure analyzer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "onnxruntime>=1.19.0",
    "tokenizers>=0.20.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.12",
    "python-docx>=1.1.0",
    "pypdf>=5.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
train = [
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "datasets>=2.20.0",
    "optimum[onnxruntime]>=1.21.0",
    "scikit-learn>=1.4.0",
]

[project.scripts]
scigram = "scigram.cli:main"

[tool.setuptools.packages.find]
include = ["scigram*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
